# Portal config for the all-in-one image: every app runs in this container.

# Keep https when behind Cloudflare Tunnel / another proxy
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 0;

  # Docker DNS: lets optional sidecar containers (calibre-web, maps) be
  # resolved at request time, so nginx starts fine when they aren't deployed.
  resolver 127.0.0.11 valid=10s ipv6=off;

  root  /usr/share/nginx/html;
  index index.html;

  error_page 502 503 504 /unavailable.html;
  location = /unavailable.html { internal; }

  location = / { try_files /index.html =404; }

  location /kiwix {
    proxy_pass http://127.0.0.1:8081;
    include /etc/nginx/snippets/proxy.conf;
  }

  location = /kolibri { return 301 /kolibri/; }
  location /kolibri/ {
    proxy_pass http://127.0.0.1:8082;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Optional sidecar: Calibre-Web container named "calibre-web"
  location = /books { return 301 /books/; }
  location /books/ {
    set $calibre calibre-web:8083;
    proxy_pass http://$calibre;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Script-Name /books;
  }

  # Optional sidecar: TileServer GL container named "maps"
  location = /maps { return 301 /maps/; }
  location /maps/ {
    set $maps maps:8080;
    rewrite ^/maps/(.*)$ /$1 break;
    proxy_pass http://$maps;
    include /etc/nginx/snippets/proxy.conf;
  }

  location /files/ {
    alias /data/files/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    charset utf-8;
  }
}
