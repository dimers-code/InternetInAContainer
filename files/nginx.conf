# Read-only file share for everything in DATA_DIR/files.
# The portal proxies /files/ here unchanged, so this serves under /files/ too.

server {
  listen 80 default_server;
  server_name _;

  # Keep redirects relative so they work behind the portal on any HTTP_PORT.
  absolute_redirect off;

  location = /files { return 301 /files/; }
  location /files/ {
    alias /srv/files/;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
    charset utf-8;
  }
}
