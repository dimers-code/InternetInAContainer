# Builds the Kolibri image and publishes it to GitHub Container Registry as
#   ghcr.io/<owner>/iiab-kolibri:<KOLIBRI_VERSION>  (and :latest)
# for amd64 and arm64 (Raspberry Pi 4/5).
#
# Runs when kolibri/ changes on main, or by hand from the Actions tab
# (optionally with a different Kolibri version).

name: Kolibri image

on:
  push:
    branches: [main]
    paths:
      - "kolibri/**"
      - ".github/workflows/kolibri-image.yml"
  workflow_dispatch:
    inputs:
      kolibri_version:
        description: "Kolibri version to build (blank = default in kolibri/Dockerfile)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out version and image name
        id: vars
        env:
          INPUT_VERSION: ${{ inputs.kolibri_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^ARG KOLIBRI_VERSION=//p' kolibri/Dockerfile)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/iiab-kolibri" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=iiab-kolibri
            org.opencontainers.image.description=Kolibri ${{ steps.vars.outputs.version }} for Internet-in-a-Container

      - uses: docker/build-push-action@v6
        with:
          context: ./kolibri
          platforms: linux/amd64,linux/arm64
          build-args: KOLIBRI_VERSION=${{ steps.vars.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
