# Builds the all-in-one image (portal + Kiwix + Kolibri) and publishes it as
#   ghcr.io/<owner>/iiab:latest  (plus :sha-<commit>)
# for amd64 and arm64 (Raspberry Pi 4/5).

name: IIAB image

on:
  push:
    branches: [main]
    paths:
      - "iiab/**"
      - "portal/**"
      - "kiwix/**"
      - "scripts/**"
      - ".github/workflows/iiab-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: vars
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/iiab" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.title=iiab
            org.opencontainers.image.description=Internet-in-a-Container: portal, Kiwix and Kolibri in one image

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: iiab/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
