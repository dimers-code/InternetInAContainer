# IIAB-style portal: one front door, every app on its own path.
# Upstreams are resolved at request time (Docker DNS) so nginx still starts
# when optional apps (kolibri, books, maps, files) aren't enabled.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 0;

  root  /usr/share/nginx/html;
  index index.html;

  error_page 502 503 504 /unavailable.html;
  location = /unavailable.html { internal; }

  location = / { try_files /index.html =404; }

  # Kiwix: Wikipedia, Gutenberg, Khan Academy, etc. (ZIM files)
  location /kiwix {
    set $kiwix kiwix:8080;
    proxy_pass http://$kiwix;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Kolibri runs with KOLIBRI_URL_PATH_PREFIX=/kolibri/
  location = /kolibri { return 301 /kolibri/; }
  location /kolibri/ {
    set $kolibri kolibri:8080;
    proxy_pass http://$kolibri;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Calibre-Web strips this prefix itself via X-Script-Name (no trailing slash)
  location = /books { return 301 /books/; }
  location /books/ {
    set $calibre calibre-web:8083;
    proxy_pass http://$calibre;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Script-Name /books;
  }

  # TileServer GL (OpenStreetMap .mbtiles)
  location = /maps { return 301 /maps/; }
  location /maps/ {
    set $maps maps:8080;
    rewrite ^/maps/(.*)$ /$1 break;
    proxy_pass http://$maps;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Plain file share (served by the "files" container, path kept as-is)
  location = /files { return 301 /files/; }
  location /files/ {
    set $files files:80;
    proxy_pass http://$files;
    include /etc/nginx/snippets/proxy.conf;
  }
}
